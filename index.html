<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumush uchun savollar ✨</title>

    <!-- Canvas Confetti Kutubxonasi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 40px 30px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 5%;
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            transition: width 0.3s ease;
        }

        h2 {
            color: #ff4b2b;
            margin-top: 0;
            font-size: 22px;
        }

        .question-box {
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .question-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #ffd1d1;
            border-radius: 15px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            background: #fff;
        }

        input[type="text"]:focus {
            border-color: #ff4b2b;
            box-shadow: 0 0 10px rgba(255, 75, 43, 0.2);
        }

        .btn-next {
            margin-top: 20px;
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.3);
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 75, 43, 0.4);
        }

        .result-box {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="card">
    <div id="quizContent">
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <h2 id="stepCounter">1 / 20 ✨</h2>
        
        <div class="question-box">
            <p class="question-title" id="questionText">1. Eng yoqtirgan ovqatingiz qaysi?</p>
            <input type="text" id="answerInput" placeholder="Javobingizni yozing..." autocomplete="off">
        </div>

        <button class="btn-next" onclick="nextQuestion()">Keyingisi ➔</button>
    </div>

    <div class="result-box" id="resultContent">
        <h2>Rahmat, Kumush! 🎉💖</h2>
        <p style="color: #555; font-size: 16px; line-height: 1.6;">
            Barcha 20 ta savolga erinmay javob berganingiz uchun rahmat! Siz haqingizda ko'proq bilib olganimdan juda xursandman. Bugungi kuningiz a'lo va tabassumga boy o'tsin! ✨
        </p>
    </div>
</div>

<script>
    const questions = [
        "1. Eng yoqtirgan taomingiz qaysi? 🍕",
        "2. Sevimli shirinligingiz yoki ichimligingiz? 🧋",
        "3. Eng qadrdon va sevimli kitobingiz? 📚",
        "4. Qaysi film yoki serialni qayta-qayta ko'rgansiz? 🎬",
        "5. Har doim tinglaydigan sevimli musiqangiz yoki qo'shiqchingiz? 🎶",
        "6. Eng yaqin, qadrdon do'stingiz kim? 🤝",
        "7. Sevimli yillik faslingiz qaysi? ❄️🌸",
        "8. Yoqtirgan rangi nima? 🎨",
        "9. Sevimli hayvoningiz yoki uy hayvoningiz? 🐾",
        "10. Bo'sh vaqtingizda nima qilishni yaxshi ko'rasiz? 🎨",
        "11. Sayohat qilishni orzu qiladigan shahringiz yoki davlatingiz? ✈️",
        "12. Sizni darhol kuldira oladigan nima? 😊",
        "13. Kuningizni yaxshi boshlashga yordam beradigan narsa? ☕",
        "14. Eng yaxshi ko'radigan gulingiz? 💐",
        "15. O'zingizda yoqadigan eng yaxshi fe'l-atvoringiz? 🌟",
        "16. Insonlarda eng ko'p qadrlaydigan xislatingiz? 💖",
        "17. Bolaligingizdagi eng yoqimli xotirangiz? 🎈",
        "18. Sizni ruhingizni tetiklashtiradigan mashg'ulot? 🎧",
        "19. Dunyodagi eng sevimli maskaningiz? 🏡",
        "20. Bugungi kunga tilagingiz yoki kichik orzuingiz? ✨"
    ];

    let currentStep = 0;
    const answers = {};

    function nextQuestion() {
        const input = document.getElementById('answerInput');
        const userAns = input.value.trim();

        if (userAns === "") {
            alert("Iltimos, avval javob yozing! 😊");
            return;
        }

        // Javobni saqlash
        answers[`Savol_${currentStep + 1}`] = `${questions[currentStep]} -> ${userAns}`;
        input.value = "";

        currentStep++;

        if (currentStep < questions.length) {
            // Keyingi savolga o'tish
            document.getElementById('questionText').innerText = questions[currentStep];
            document.getElementById('stepCounter').innerText = `${currentStep + 1} / 20 ✨`;
            
            // Progress barni yangilash
            const percent = ((currentStep + 1) / questions.length) * 100;
            document.getElementById('progress').style.width = percent + "%";
        } else {
            // Barcha savollar tugaganda
            document.getElementById('quizContent').style.display = 'none';
            document.getElementById('resultContent').style.display = 'block';

            // Konfetti effekti
            triggerConfetti();

            // Formspree orqali pochtaga yuborish
            fetch("https://formspree.io/f/xzebpykw", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(answers)
            });
        }
    }

    // Enter tugmasini bossa ham keyingisiga o'tishi uchun
    document.getElementById('answerInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            nextQuestion();
        }
    });

    function triggerConfetti() {
        var count = 200;
        var defaults = { origin: { y: 0.7 } };

        function fire(particleRatio, opts) {
            confetti(Object.assign({}, defaults, opts, {
                particleCount: Math.floor(count * particleRatio)
            }));
        }

        fire(0.25, { spread: 26, startVelocity: 55 });
        fire(0.2, { spread: 60 });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
        fire(0.1, { spread: 120, startVelocity: 45 });
    }
</script>

</body>
</html>
