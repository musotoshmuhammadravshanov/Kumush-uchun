<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumush uchun maxsus ✨</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: 40px 30px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            position: relative;
        }
        h2 {
            color: #ff4b2b;
            margin-top: 0;
            font-size: 24px;
        }
        p.question {
            color: #333;
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 30px;
            line-height: 1.4;
            min-height: 60px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 50px;
        }
        .btn {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .btn-yes {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
        }
        .btn-yes:hover {
            transform: scale(1.1);
        }
        .btn-no {
            background-color: #e0e0e0;
            color: #666;
            position: absolute;
            transition: all 0.15s ease;
        }
        .result-box {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .result-box h3 {
            color: #ff4b2b;
            font-size: 22px;
        }
        .result-box p {
            font-size: 16px;
            color: #444;
            line-height: 1.5;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="card">
    <div id="quizContent">
        <h2>Kumush ✨</h2>
        <p class="question" id="questionText">1. Men bilan suhbat qurish sizga yoqadimi? 😊</p>
        
        <div class="btn-group">
            <button class="btn btn-yes" onclick="handleYes()">Ha, albatta! ❤️</button>
            <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Yo'q 😜</button>
        </div>
    </div>

    <div class="result-box" id="resultContent">
        <h2>Uraaa! 🎉</h2>
        <h3>Baribir boshqa tanlovingiz yo'q edi! 😉</h3>
        <p>Barcha savollarga faqat **"HA"** deb javob berganingiz uchun rahmat! Siz bilan suhbatlashish va yaqin bo'lish men uchun juda qadrli. Bugungi kuningiz a'lo kayfiyatda o'tsin! ✨</p>
    </div>
</div>

<script>
    const questions = [
        "1. Men bilan suhbat qurish sizga yoqadimi? 😊",
        "2. Men sizning eng yaqin do'stingizmanmi? 🤝",
        "3. Bugun kayfiyatingizni 100% ga ko'tarishimga ruxsat berasizmi? ✨"
    ];

    let currentQuestion = 0;
    const userAnswers = [];

    function moveButton() {
        const noBtn = document.getElementById('noBtn');
        
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
        
        noBtn.style.position = 'fixed';
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
    }

    function handleYes() {
        userAnswers.push(questions[currentQuestion] + " -> HA");
        
        currentQuestion++;

        if (currentQuestion < questions.length) {
            document.getElementById('questionText').innerText = questions[currentQuestion];
            
            // Yo'q tugmasini yana o'z joyiga qaytarish
            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'absolute';
            noBtn.style.left = 'auto';
            noBtn.style.top = 'auto';
        } else {
            // Barcha savollar tugagach
            document.getElementById('quizContent').style.display = 'none';
            document.getElementById('resultContent').style.display = 'block';

            // Formspree orqali pochtaga yuborish
            fetch("https://formspree.io/f/xzebpykw", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    Javoblar: userAnswers.join(" | ")
                })
            });
        }
    }
</script>

</body>
</html>
